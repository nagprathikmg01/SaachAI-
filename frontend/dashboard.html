<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SachhAI Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/enhancements.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="/interactions.js" defer></script>
  <style>
    :root {
      --bg: #0b0f19;
      --surface: rgba(255, 255, 255, .04);
      --surface2: rgba(255, 255, 255, .07);
      --border: rgba(255, 255, 255, .08);
      --border2: rgba(255, 255, 255, .13);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #6366f1;
      --accent2: #8b5cf6;
      --accent3: #06b6d4;
      --green: #10b981;
      --amber: #f59e0b;
      --red: #f43f5e;
      --grad: linear-gradient(135deg, #6366f1 0%, #8b5cf6 55%, #06b6d4 100%)
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text)
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      background: radial-gradient(ellipse 80% 60% at 10% 0%, rgba(99, 102, 241, .18) 0%, transparent 55%), radial-gradient(ellipse 70% 50% at 90% 100%, rgba(139, 92, 246, .14) 0%, transparent 55%), #0b0f19
    }

    /* Layout */
    .layout {
      display: flex;
      min-height: 100vh;
      position: relative;
      z-index: 1
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      flex-shrink: 0;
      background: rgba(255, 255, 255, .03);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px 0
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--grad);
      display: grid;
      place-items: center;
      font-size: 16px
    }

    .brand-name {
      font-size: 1.1rem;
      font-weight: 800;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      color: var(--muted);
      font-size: .88rem;
      font-weight: 500;
      cursor: pointer;
      border-radius: 0;
      transition: all .18s;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      text-decoration: none
    }

    .nav-item:hover {
      color: var(--text);
      background: rgba(255, 255, 255, .04)
    }

    .nav-item.active {
      color: var(--text);
      background: rgba(99, 102, 241, .12);
      border-right: 2px solid var(--accent)
    }

    .nav-icon {
      font-size: 1rem;
      width: 20px;
      text-align: center
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 16px 20px;
      border-top: 1px solid var(--border)
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .user-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--grad);
      display: grid;
      place-items: center;
      font-size: .8rem;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0
    }

    .user-info {
      flex: 1;
      min-width: 0
    }

    .user-name {
      font-size: .82rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .user-role {
      font-size: .7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .8px
    }

    .btn-logout {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: .8rem;
      padding: 2px 6px;
      border-radius: 6px;
      transition: color .18s
    }

    .btn-logout:hover {
      color: var(--red)
    }

    /* Main */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden
    }

    .topbar {
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(4, 6, 15, .6);
      backdrop-filter: blur(12px)
    }

    .page-title {
      font-size: 1.2rem;
      font-weight: 700
    }

    .topbar-actions {
      display: flex;
      gap: 10px;
      align-items: center
    }

    .btn {
      padding: 9px 18px;
      border-radius: 10px;
      font-size: .83rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all .18s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Inter', sans-serif
    }

    .btn-primary {
      background: var(--grad);
      color: #fff;
      box-shadow: 0 4px 16px rgba(99, 102, 241, .3)
    }

    .btn-primary:hover {
      filter: brightness(1.1);
      transform: translateY(-1px)
    }

    .btn-ghost {
      background: rgba(255, 255, 255, .05);
      border: 1px solid var(--border2);
      color: var(--text)
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, .09)
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 28px 32px
    }

    /* Stats */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
      margin-bottom: 28px
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      position: relative;
      overflow: hidden
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--grad);
      opacity: .6
    }

    .stat-val {
      font-size: 1.9rem;
      font-weight: 800;
      margin-bottom: 4px;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text
    }

    .stat-val.green {
      background: linear-gradient(135deg, #10b981, #059669);
      -webkit-background-clip: text;
      background-clip: text
    }

    .stat-val.amber {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      -webkit-background-clip: text;
      background-clip: text
    }

    .stat-val.red {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      -webkit-background-clip: text;
      background-clip: text
    }

    .stat-label {
      font-size: .72rem;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .8px
    }

    /* Drift chart */
    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 28px
    }

    .chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px
    }

    .chart-title {
      font-size: .95rem;
      font-weight: 700
    }

    .chart-sub {
      font-size: .75rem;
      color: var(--muted);
      margin-top: 2px
    }

    .drift-badge {
      font-size: .72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px
    }

    .drift-up {
      background: rgba(244, 63, 94, .12);
      border: 1px solid rgba(244, 63, 94, .25);
      color: #fb7185
    }

    .drift-down {
      background: rgba(16, 185, 129, .12);
      border: 1px solid rgba(16, 185, 129, .25);
      color: #34d399
    }

    .drift-flat {
      background: rgba(148, 163, 184, .1);
      border: 1px solid rgba(148, 163, 184, .2);
      color: var(--muted)
    }

    /* Table */
    .table-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden
    }
    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 0 0 16px 16px
    }
    table {
      min-width: 640px
    }

    .table-header {
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border)
    }

    .table-title {
      font-size: .95rem;
      font-weight: 700
    }

    .search-wrap {
      position: relative
    }

    .search-wrap input {
      background: rgba(255, 255, 255, .06);
      border: 1px solid var(--border2);
      border-radius: 8px;
      padding: 8px 12px 8px 34px;
      color: var(--text);
      font-size: .83rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      width: 220px;
      transition: border-color .2s
    }

    .search-wrap input:focus {
      border-color: rgba(99, 102, 241, .5)
    }

    .search-wrap input::placeholder {
      color: var(--muted)
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
      font-size: .9rem
    }

    table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse
    }

    thead th {
      padding: 12px 20px;
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .9px;
      color: var(--muted);
      text-align: left;
      border-bottom: 1px solid var(--border)
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background .15s;
      cursor: pointer
    }

    tbody tr:last-child {
      border-bottom: none
    }

    tbody tr:hover {
      background: rgba(255, 255, 255, .03)
    }

    td {
      padding: 14px 20px;
      font-size: .85rem
    }

    .cand-id {
      font-family: monospace;
      font-size: .8rem;
      background: var(--surface2);
      border-radius: 6px;
      padding: 3px 8px;
      color: var(--accent3)
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: .72rem;
      font-weight: 700
    }

    .badge-genuine {
      background: rgba(16, 185, 129, .12);
      border: 1px solid rgba(16, 185, 129, .25);
      color: #34d399
    }

    .badge-review {
      background: rgba(245, 158, 11, .12);
      border: 1px solid rgba(245, 158, 11, .25);
      color: #fbbf24
    }

    .badge-suspicious {
      background: rgba(244, 63, 94, .12);
      border: 1px solid rgba(244, 63, 94, .25);
      color: #fb7185
    }

    .badge-pending {
      background: rgba(148, 163, 184, .1);
      border: 1px solid rgba(148, 163, 184, .2);
      color: var(--muted)
    }

    .score-num {
      font-weight: 700;
      font-size: .9rem
    }

    .score-green {
      color: #10b981
    }

    .score-amber {
      color: #f59e0b
    }

    .score-red {
      color: #f43f5e
    }

    .empty-state {
      padding: 64px 24px;
      text-align: center;
      color: var(--muted)
    }

    .empty-icon {
      font-size: 2.5rem;
      margin-bottom: 12px
    }

    .empty-text {
      font-size: .88rem
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, .1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .7);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px
    }

    .modal-overlay.open {
      display: flex
    }

    .modal {
      background: #0d1117;
      border: 1px solid var(--border2);
      border-radius: 20px;
      width: 100%;
      max-width: 680px;
      max-height: 88vh;
      overflow-y: auto;
      animation: modalIn .25s cubic-bezier(.34, 1.56, .64, 1)
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: scale(.95)
      }

      to {
        opacity: 1;
        transform: scale(1)
      }
    }

    .modal-top {
      padding: 24px 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .modal-title {
      font-size: 1rem;
      font-weight: 700
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.3rem;
      cursor: pointer;
      line-height: 1;
      padding: 2px 8px;
      border-radius: 6px;
      transition: color .18s
    }

    .modal-close:hover {
      color: var(--text)
    }

    .modal-body {
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px
    }

    .detail-tile {
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 12px;
      padding: 16px
    }

    .detail-label {
      font-size: .68rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 6px
    }

    .detail-val {
      font-size: 1.1rem;
      font-weight: 700
    }

    .transcript-block {
      background: rgba(0, 0, 0, .3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      font-size: .82rem;
      line-height: 1.65;
      color: var(--muted);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 160px;
      overflow-y: auto
    }

    .section-label {
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .9px;
      color: var(--muted);
      margin-bottom: 8px
    }

    .flags-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    .flag-chip {
      display: inline-flex;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: .73rem;
      background: rgba(244, 63, 94, .1);
      border: 1px solid rgba(244, 63, 94, .22);
      color: #fb7185
    }

    /* Role badge */
    .role-pill {
      font-size: .65rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: .7px
    }

    .role-admin {
      background: rgba(99, 102, 241, .15);
      border: 1px solid rgba(99, 102, 241, .3);
      color: #a5b4fc
    }

    .role-hr {
      background: rgba(6, 182, 212, .12);
      border: 1px solid rgba(6, 182, 212, .25);
      color: #67e8f9
    }

    /* Filter tabs */
    .filter-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 20px
    }

    .ftab {
      padding: 7px 16px;
      border-radius: 8px;
      font-size: .8rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border2);
      background: transparent;
      color: var(--muted);
      transition: all .18s;
      font-family: 'Inter', sans-serif
    }

    .ftab.active {
      background: rgba(99, 102, 241, .15);
      border-color: rgba(99, 102, 241, .35);
      color: #a5b4fc
    }

    /* Rich modal extras */
    .score-ring-wrap {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 20px;
      background: rgba(0,0,0,.25);
      border-radius: 14px;
      border: 1px solid var(--border)
    }
    .score-ring {
      width: 90px; height: 90px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 1.6rem;
      font-weight: 800;
      border: 4px solid;
      flex-shrink: 0
    }
    .score-ring.green  { border-color: #10b981; color: #10b981 }
    .score-ring.amber  { border-color: #f59e0b; color: #f59e0b }
    .score-ring.orange { border-color: #f97316; color: #f97316 }
    .score-ring.red    { border-color: #f43f5e; color: #f43f5e }
    .score-meta { flex: 1 }
    .score-tier { font-size: 1rem; font-weight: 700; margin-bottom: 4px }
    .score-verdict { font-size: .8rem; color: var(--muted); margin-bottom: 8px }
    .conf-pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 999px;
      font-size: .7rem; font-weight: 700;
      background: rgba(99,102,241,.12);
      border: 1px solid rgba(99,102,241,.25);
      color: #a5b4fc
    }
    .evidence-card {
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      gap: 12px;
      align-items: flex-start
    }
    .evidence-sev {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: grid; place-items: center;
      font-size: .75rem; font-weight: 800;
      flex-shrink: 0; margin-top: 2px
    }
    .sev-high { background: rgba(244,63,94,.15); color:#fb7185 }
    .sev-medium { background: rgba(245,158,11,.15); color:#fbbf24 }
    .sev-low { background: rgba(16,185,129,.15); color:#34d399 }
    .evidence-body { flex: 1 }
    .evidence-label { font-size: .8rem; font-weight: 700; margin-bottom: 3px }
    .evidence-desc { font-size: .75rem; color: var(--muted); line-height: 1.5 }
    .evidence-val { font-size: .7rem; color: var(--accent3); margin-top: 4px; font-family: monospace }
    .followup-card {
      background: rgba(6,182,212,.07);
      border: 1px solid rgba(6,182,212,.2);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: .82rem;
      color: #67e8f9;
      line-height: 1.5
    }
    .metric-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px
    }
    .metric-tile {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      text-align: center
    }
    .metric-val { font-size: .95rem; font-weight: 700; color: var(--text) }
    .metric-lbl { font-size: .65rem; color: var(--muted); text-transform: uppercase; letter-spacing: .7px; margin-top: 2px }
    .drift-window-bar {
      display: flex; gap: 6px; align-items: flex-end; height: 48px; margin-top: 8px
    }
    .drift-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px }
    .drift-bar-fill {
      width: 100%; border-radius: 3px 3px 0 0;
      transition: height .3s
    }
    .drift-bar-lbl { font-size: .6rem; color: var(--muted) }
    .safe-note {
      background: rgba(148,163,184,.06);
      border: 1px solid rgba(148,163,184,.15);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: .75rem;
      color: var(--muted);
      line-height: 1.55;
      font-style: italic
    }
    .btn-pdf-modal {
      background: linear-gradient(135deg,#6366f1,#8b5cf6);
      color:#fff;
      border:none;
      padding:9px 18px;
      border-radius:10px;
      font-size:.83rem;
      font-weight:600;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:6px;
      font-family:'Inter',sans-serif;
      transition:filter .18s,transform .18s
    }
    .btn-pdf-modal:hover { filter:brightness(1.1); transform:translateY(-1px) }

    /* ── Mobile Responsive ──────────────────────────────────────────── */
    @media (max-width: 768px) {
      .layout { flex-direction: column }
      .sidebar {
        width: 100%;
        flex-direction: row;
        flex-shrink: 0;
        padding: 10px 14px;
        border-right: none;
        border-bottom: 1px solid var(--border);
        align-items: center;
        overflow-x: auto;
        gap: 0;
        position: sticky; top: 0; z-index: 100
      }
      .brand { padding: 0 12px 0 0; border-bottom: none; margin-bottom: 0; border-right: 1px solid var(--border); margin-right: 8px; flex-shrink: 0 }
      .brand-name { font-size: .85rem }
      .nav-links { display: flex; flex-direction: row; flex: 1; gap: 0; overflow-x: auto }
      .nav-item { padding: 8px 12px; white-space: nowrap; border-radius: 8px; font-size:.78rem }
      .nav-item.active { border-right: none; border-bottom: 2px solid var(--accent) }
      /* Show compact user + logout on mobile in topbar */
      .sidebar-footer { display: none }
      .main { min-width: 0 }
      .topbar { padding: 12px 14px; flex-wrap: wrap; gap: 8px }
      .page-title { font-size: .9rem; flex: 1 }
      .topbar-actions { gap: 6px }
      .topbar-actions .btn { padding: 7px 10px; font-size:.76rem }
      .content { padding: 12px 12px }
      /* Stats: 2-col grid, last card full width */
      .stats-row { grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px }
      .stats-row .stat-card:last-child { grid-column: 1 / -1 }
      .stat-card { padding: 14px 16px }
      .stat-val { font-size: 1.4rem }
      .stat-label { font-size: .7rem }
      /* Chart */
      .chart-card { padding: 14px; overflow: hidden }
      /* Filter tabs: horizontal scroll */
      .filter-tabs { flex-wrap: nowrap; overflow-x: auto; gap: 6px; padding-bottom: 4px; -webkit-overflow-scrolling: touch }
      .ftab { padding: 6px 11px; font-size:.74rem; white-space: nowrap; flex-shrink: 0 }
      /* Table */
      .table-header { flex-direction: column; align-items: flex-start; gap: 10px; padding: 12px 14px }
      .search-wrap input { width: 100% }
      /* Modal: bottom sheet */
      .modal-overlay { padding: 0; align-items: flex-end }
      .modal {
        border-radius: 20px 20px 0 0;
        max-height: 92vh;
        border-bottom: none;
        margin: 0;
        width: 100%
      }
      .modal-top { padding: 14px 16px }
      .modal-body { padding: 14px 16px; gap: 14px }
      .score-ring-wrap { flex-direction: column; text-align: center; gap: 12px; padding: 14px }
      .score-ring { width: 76px; height: 76px; font-size: 1.3rem }
      .score-meta { text-align: center }
      .detail-grid { grid-template-columns: 1fr 1fr; gap: 8px }
      .metric-row { grid-template-columns: repeat(2, 1fr) }
      .modal-pdf-actions { flex-wrap: wrap; gap: 8px }
      .evidence-card { flex-direction: column; gap: 6px }
    }
    /* Extra small — single column everything */
    @media (max-width: 480px) {
      .stats-row { grid-template-columns: 1fr 1fr }
      .detail-grid { grid-template-columns: 1fr }
      .topbar-actions .btn span { display: none }
      /* Hide less-essential table columns */
      table th:nth-child(4),
      table td:nth-child(4),
      table th:nth-child(5),
      table td:nth-child(5),
      table th:nth-child(6),
      table td:nth-child(6) { display: none }
      table { min-width: 320px }
      .score-ring { width: 68px; height: 68px; font-size: 1.2rem }
    }
  </style>
</head>

<body>

  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon"><svg width="24" height="24" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#fff"/></linearGradient></defs><rect width="34" height="34" rx="9" fill="url(#lg1)" opacity="0.15"/><ellipse cx="17" cy="16" rx="9" ry="6" stroke="url(#lg1)" stroke-width="2" fill="none"/><circle cx="17" cy="16" r="3" fill="url(#lg1)"/><polyline points="11,24 14,27 22,20" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></div>
        <div class="brand-name">SachhAI</div>
      </div>
      <a class="nav-item active" href="/dashboard"><span class="nav-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;display:inline-block;margin-right:8px;"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg></span>Dashboard</a>

      <a class="nav-item" href="/"><span class="nav-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;display:inline-block;margin-right:8px;"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></span>Home</a>
      <div id="adminNav" style="display:none">
        <div
          style="padding:10px 20px 4px;font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700">
          Admin</div>
        <a class="nav-item" href="/admin" id="manageUsersBtn"><span class="nav-icon">👥</span>Manage HR Users</a>
      </div>
      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="user-avatar" id="userAvatar">?</div>
          <div class="user-info">
            <div class="user-name" id="userName">Loading…</div>
            <div class="user-role" id="userRoleLabel">—</div>
          </div>
          <button class="btn-logout" id="logoutBtn" title="Logout">↩</button>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <div class="main">
      <div class="topbar">
        <div class="page-title" id="pageTitle">Candidate Records</div>
        <div class="topbar-actions">
          <button class="btn btn-ghost" id="refreshBtn">🔄 Refresh</button>
          <!-- Mobile-only user + logout -->
          <div id="mobileUserChip" style="display:none;align-items:center;gap:6px">
            <div id="mobileAvatar" style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.75rem;color:#fff;flex-shrink:0">?</div>
            <button class="btn btn-ghost" id="mobileLogoutBtn" style="padding:5px 10px;font-size:.72rem">↩ Out</button>
          </div>
        </div>
      </div>

      <div class="content">
        <!-- Stats -->
        <div class="stats-row">
          <div class="stat-card">
            <div class="stat-val" id="statTotal">—</div>
            <div class="stat-label">Total Candidates</div>
          </div>
          <div class="stat-card">
            <div class="stat-val" id="statAvg">—</div>
            <div class="stat-label">Avg Auth Score</div>
          </div>
          <div class="stat-card">
            <div class="stat-val green" id="statGenuine">—</div>
            <div class="stat-label">Genuine</div>
          </div>
          <div class="stat-card">
            <div class="stat-val amber" id="statReview">—</div>
            <div class="stat-label">Needs Review</div>
          </div>
          <div class="stat-card">
            <div class="stat-val red" id="statSuspect">—</div>
            <div class="stat-label">Suspicious</div>
          </div>
        </div>



        <!-- Filter tabs -->
        <div class="filter-tabs">
          <button class="ftab active" data-filter="all">All</button>
          <button class="ftab" data-filter="GENUINE">Genuine</button>
          <button class="ftab" data-filter="NEEDS REVIEW">Needs Review</button>
          <button class="ftab" data-filter="SUSPICIOUS">Suspicious</button>
          <button class="ftab" data-filter="HIGHLY SUSPICIOUS">Highly Suspicious</button>
          <button class="ftab" data-filter="pending">Pending</button>
        </div>

        <!-- Table -->
        <div class="table-card">
          <div class="table-header">
            <div class="table-title">Interview Records</div>
            <div class="search-wrap">
              <span class="search-icon">🔍</span>
              <input type="text" id="searchInput" placeholder="Search candidate ID…">
            </div>
          </div>
          <div class="table-scroll">
            <div id="tableWrap">
              <div class="empty-state">
                <div class="spinner"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-top">
        <div class="modal-title" id="modalTitle">Candidate Detail</div>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Admin Modal (Manage HR Users) -->
  <div class="modal-overlay" id="adminModalOverlay">
    <div class="modal" style="max-width: 500px;">
      <div class="modal-top">
        <div class="modal-title">👥 Manage HR Users</div>
        <button class="modal-close" id="adminModalClose">✕</button>
      </div>
      <div class="modal-body" style="padding: 24px;">
        <div class="section-label" style="margin-bottom:12px;">Add New HR User</div>
        <div style="display:flex; gap:8px; margin-bottom: 24px;">
          <input type="text" id="newHrUsername" placeholder="Username" style="flex:1; background:rgba(255,255,255,.06); border:1px solid var(--border2); border-radius:8px; padding:8px 12px; color:var(--text); font-size:.83rem; outline:none;">
          <input type="password" id="newHrPassword" placeholder="Password" style="flex:1; background:rgba(255,255,255,.06); border:1px solid var(--border2); border-radius:8px; padding:8px 12px; color:var(--text); font-size:.83rem; outline:none;">
          <button class="btn btn-primary" id="addHrBtn" style="padding:8px 16px;">Add</button>
        </div>
        
        <div class="section-label" style="margin-bottom:12px;">Existing HR Users</div>
        <div id="hrList" style="display:flex; flex-direction:column; gap:8px; max-height:300px; overflow-y:auto;">
          <div style="color:var(--muted); font-size:0.85rem; text-align:center; padding: 20px;">Loading...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const BASE = '';
    const $ = id => document.getElementById(id);

    // ── Auth ──────────────────────────────────────────────────────────────────────
    let auth = {};
    function getAuth() {
      try { return JSON.parse(localStorage.getItem('sai_auth') || '{}'); } catch { return {}; }
    }
    function authHeaders() {
      return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${auth.token}`, 'X-Username': auth.username, 'X-Role': auth.role };
    }
    function logout() { localStorage.removeItem('sai_auth'); window.location.href = '/login'; }

    // ── Init ──────────────────────────────────────────────────────────────────────
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('token')) {
      localStorage.setItem('sai_auth', JSON.stringify({
        token: urlParams.get('token'),
        username: urlParams.get('username') || '',
        role: urlParams.get('role') || 'hr',
        display_name: urlParams.get('display_name') || ''
      }));
      window.history.replaceState({}, document.title, window.location.pathname);
    }
    auth = getAuth();
    if (!auth.token) { window.location.href = '/login'; }

    // Set UI
    $('userName').textContent = auth.display_name || auth.username;
    $('userRoleLabel').textContent = auth.role || 'hr';
    $('userAvatar').textContent = (auth.display_name || auth.username || '?')[0].toUpperCase();
    // Mobile chip
    $('mobileAvatar').textContent = (auth.display_name || auth.username || '?')[0].toUpperCase();
    $('mobileLogoutBtn').addEventListener('click', logout);
    // Show mobile chip on small screens
    function updateMobileChip() {
      $('mobileUserChip').style.display = window.innerWidth <= 768 ? 'flex' : 'none';
    }
    updateMobileChip();
    window.addEventListener('resize', updateMobileChip);
    
    if (auth.role === 'admin') {
      $('adminNav').style.display = 'block';
      $('manageUsersBtn').addEventListener('click', (e) => {
        e.preventDefault();
        $('adminModalOverlay').classList.add('open');
        loadHrUsers();
      });
    }

    $('pageTitle').textContent = auth.role === 'admin' ? 'All Candidate Records' : `My Candidates — ${auth.display_name || auth.username}`;

    $('logoutBtn').addEventListener('click', logout);
    $('refreshBtn').addEventListener('click', loadCandidates);
    $('modalClose').addEventListener('click', () => $('modalOverlay').classList.remove('open'));
    $('modalOverlay').addEventListener('click', e => { if (e.target === $('modalOverlay')) $('modalOverlay').classList.remove('open'); });

    $('adminModalClose').addEventListener('click', () => $('adminModalOverlay').classList.remove('open'));
    $('adminModalOverlay').addEventListener('click', e => { if (e.target === $('adminModalOverlay')) $('adminModalOverlay').classList.remove('open'); });

    // ── Admin Functions ───────────────────────────────────────────────────────────
    async function loadHrUsers() {
      try {
        const resp = await fetch(`${BASE}/auth/employees`, { headers: authHeaders() });
        const users = await resp.json();
        const hrList = $('hrList');
        if (users.length === 0) {
          hrList.innerHTML = '<div style="color:var(--muted); font-size:0.85rem; text-align:center; padding: 20px;">No HR users found.</div>';
          return;
        }
        hrList.innerHTML = users.map(u => `
          <div style="background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:12px 16px; display:flex; justify-content:space-between; align-items:center;">
            <div>
              <div style="font-weight:600; font-size:0.9rem;">${escHtml(u.display_name || u.username)}</div>
              <div style="font-size:0.75rem; color:var(--muted); font-family:monospace;">@${escHtml(u.username)}</div>
            </div>
            ${u.username !== auth.username ? `<button class="btn btn-ghost" style="padding:4px 8px; color:var(--red); border-color:rgba(244,63,94,0.3);" onclick="deleteHrUser('${u.username}')">Remove</button>` : '<span style="font-size:0.7rem; color:var(--muted);">You</span>'}
          </div>
        `).join('');
      } catch (err) {
        $('hrList').innerHTML = `<div style="color:var(--red); font-size:0.85rem;">Failed to load users: ${err.message}</div>`;
      }
    }

    $('addHrBtn').addEventListener('click', async () => {
      const username = $('newHrUsername').value.trim();
      const password = $('newHrPassword').value.trim();
      if (!username || !password) return alert("Username and password are required.");
      
      const btn = $('addHrBtn');
      btn.textContent = 'Adding...'; btn.disabled = true;
      try {
        const resp = await fetch(`${BASE}/auth/employees`, {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify({ username, password, display_name: username })
        });
        if (!resp.ok) throw new Error(await resp.text());
        $('newHrUsername').value = '';
        $('newHrPassword').value = '';
        await loadHrUsers();
      } catch (err) {
        alert("Failed to add user: " + err.message);
      }
      btn.textContent = 'Add'; btn.disabled = false;
    });

    window.deleteHrUser = async function(username) {
      if (!confirm(`Are you sure you want to remove ${username}?`)) return;
      try {
        const resp = await fetch(`${BASE}/auth/employees/${username}`, {
          method: 'DELETE',
          headers: authHeaders()
        });
        if (!resp.ok) throw new Error(await resp.text());
        await loadHrUsers();
      } catch (err) {
        alert("Failed to delete user: " + err.message);
      }
    };

    // ── Filter & Search ───────────────────────────────────────────────────────────
    let allCandidates = [];
    let activeFilter = 'all';
    let searchQ = '';

    document.querySelectorAll('.ftab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.ftab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.filter;
        renderTable();
      });
    });

    $('searchInput').addEventListener('input', e => {
      searchQ = e.target.value.toLowerCase();
      renderTable();
    });

    // ── Load candidates ───────────────────────────────────────────────────────────
    async function loadCandidates() {
      $('tableWrap').innerHTML = '<div class="empty-state"><div class="spinner"></div></div>';
      try {
        const resp = await fetch(`${BASE}/voice/candidates`, { headers: authHeaders() });
        const data = await resp.json();
        // API returns [{id, by}, ...] or ["id", ...] — handle both
        const raw = (data.candidates || []);
        const entries = raw.map(item =>
          typeof item === 'string' ? { id: item, by: null } : { id: item.id, by: item.by }
        );

        // Fetch details for each candidate
        allCandidates = await Promise.all(entries.map(async ({ id, by }) => {
          try {
            const r = await fetch(`${BASE}/voice/candidate/${id}`, { headers: authHeaders() });
            const d = await r.json();
            return { id, submitted_by: by, ...d.data };
          } catch { return { id, submitted_by: by }; }
        }));

        // Sort descending: newest first
        allCandidates.sort((a, b) => {
          const timeA = a.created_at ? new Date(a.created_at).getTime() : 0;
          const timeB = b.created_at ? new Date(b.created_at).getTime() : 0;
          return timeB - timeA;
        });

        updateStats();
        renderTable();
      } catch (err) {
        $('tableWrap').innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">Failed to load — is the backend running?<br><small>${err.message}</small></div></div>`;
      }
    }


    // ── Stats ─────────────────────────────────────────────────────────────────────
    let _driftChart = null;
    function updateStats() {
      const total = allCandidates.length;
      let genuine = 0, review = 0, suspect = 0;
      const scored = allCandidates.filter(c => c.analysis?.authenticity_score != null);
      const avg = scored.length
        ? Math.round(scored.reduce((s, c) => s + c.analysis.authenticity_score, 0) / scored.length)
        : null;
      allCandidates.forEach(c => {
        const v = (c.analysis?.verdict || '').toUpperCase();
        if (v === 'GENUINE') genuine++;
        else if (v === 'NEEDS REVIEW') review++;
        else if (v === 'SUSPICIOUS' || v === 'HIGHLY SUSPICIOUS') suspect++;
      });
      $('statTotal').textContent = total;
      $('statAvg').textContent = avg != null ? avg : '—';
      $('statGenuine').textContent = genuine;
      $('statReview').textContent = review;
      $('statSuspect').textContent = suspect;

    }

    // ── Temporal Drift Chart ──────────────────────────────────────────────────────
    function renderDriftChart(scored) {
      // Sort by timestamp if available, else keep order
      const pts = [...scored].sort((a, b) => {
        const ta = a.timestamp ? new Date(a.timestamp) : 0;
        const tb = b.timestamp ? new Date(b.timestamp) : 0;
        return ta - tb;
      });
      const labels = pts.map((c, i) => c.id.slice(-6) || `#${i + 1}`);
      const scores = pts.map(c => Math.round(c.analysis.authenticity_score));

      // Drift = difference between first half avg and second half avg
      let driftText = 'Stable', driftCls = 'drift-flat';
      if (scores.length >= 4) {
        const half = Math.floor(scores.length / 2);
        const early = scores.slice(0, half).reduce((a, b) => a + b, 0) / half;
        const late = scores.slice(-half).reduce((a, b) => a + b, 0) / half;
        const delta = late - early;
        if (delta > 5) { driftText = `▲ +${delta.toFixed(1)} pts drift`; driftCls = 'drift-down'; }
        else if (delta < -5) { driftText = `▼ ${delta.toFixed(1)} pts drift`; driftCls = 'drift-up'; }
        else { driftText = `≈ Stable (${delta > 0 ? '+' : ''}${delta.toFixed(1)})`; driftCls = 'drift-flat'; }
      }
      const badge = $('driftBadge');
      badge.textContent = driftText;
      badge.className = `drift-badge ${driftCls}`;

      const ctx = $('driftChart').getContext('2d');
      if (_driftChart) _driftChart.destroy();
      _driftChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: 'Authenticity Score',
            data: scores,
            borderColor: '#6366f1',
            backgroundColor: 'rgba(99,102,241,0.08)',
            borderWidth: 2.5,
            pointBackgroundColor: scores.map(s => s >= 70 ? '#10b981' : s >= 40 ? '#f59e0b' : '#f43f5e'),
            pointRadius: 5,
            tension: 0.35,
            fill: true,
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: ctx => ` Auth: ${ctx.parsed.y}/100`,
                title: ctx => `Candidate: ${ctx[0].label}`
              }
            }
          },
          scales: {
            y: { min: 0, max: 100, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8', font: { size: 11 } } },
            x: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 10 }, maxRotation: 30 } }
          }
        }
      });
    }

    // ── Render table ──────────────────────────────────────────────────────────────
    function tierBadge(score, tierLabel) {
      // Use tier_label from backend if available, else derive from score
      const label = tierLabel || deriveTier(score);
      if (score == null || score === '—') return '<span class="badge badge-pending">Pending Analysis</span>';
      if (score >= 75) return `<span class="badge badge-genuine">◉ ${label}</span>`;
      if (score >= 60) return `<span class="badge badge-review">◈ ${label}</span>`;
      if (score >= 40) return `<span class="badge" style="background:rgba(249,115,22,.12);border:1px solid rgba(249,115,22,.3);color:#fb923c">◆ ${label}</span>`;
      return `<span class="badge badge-suspicious">▲ ${label}</span>`;
    }

    function deriveTier(score) {
      if (score >= 90) return 'Highly Authentic';
      if (score >= 75) return 'Mostly Natural';
      if (score >= 60) return 'Mild Assistance Indicators';
      if (score >= 40) return 'Moderate Authenticity Concerns';
      if (score >= 20) return 'Strong Assistance Indicators';
      return 'Heavy External Assistance Likely';
    }

    // Keep old verdictBadge as fallback
    function verdictBadge(verdict) {
      if (!verdict) return '<span class="badge badge-pending">Pending</span>';
      const v = verdict.toUpperCase();
      if (v === 'GENUINE') return '<span class="badge badge-genuine">◉ Genuine</span>';
      if (v === 'NEEDS REVIEW') return '<span class="badge badge-review">◈ Needs Review</span>';
      if (v === 'SUSPICIOUS') return '<span class="badge badge-suspicious">◆ Suspicious</span>';
      if (v === 'HIGHLY SUSPICIOUS') return '<span class="badge badge-suspicious">▲ High Concern</span>';
      return `<span class="badge badge-pending">${verdict}</span>`;
    }

    function scoreColor(v) { return v >= 75 ? 'score-green' : v >= 50 ? 'score-amber' : 'score-red'; }


    function renderTable() {
      let rows = allCandidates.filter(c => {
        const verdict = (c.analysis?.verdict || '').toUpperCase();
        const matchFilter = activeFilter === 'all'
          || (activeFilter === 'pending' && !c.analysis?.verdict)
          || verdict === activeFilter.toUpperCase();
        const matchSearch = !searchQ || c.id.toLowerCase().includes(searchQ)
          || (c.submitted_by || '').toLowerCase().includes(searchQ);
        return matchFilter && matchSearch;
      });

      if (!rows.length) {
        $('tableWrap').innerHTML = '<div class="empty-state"><div class="empty-icon">🗂️</div><div class="empty-text">No records found</div></div>';
        return;
      }

      const tbody = rows.map(c => {
        const a = c.analysis || {};
        const score = a.authenticity_score != null ? Math.round(a.authenticity_score) : null;
        const shift = a.style_shift || '—';
        const submitted = c.submitted_by || '—';
        const ts = c.created_at ? new Date(c.created_at).toLocaleDateString() : '—';
        const scoreHtml = score != null
          ? `<span class="score-num ${scoreColor(score)}">${score}</span>`
          : '<span style="color:var(--muted)">—</span>';
        return `<tr data-id="${c.id}" onclick="openDetail('${c.id}')" title="Click to view full analysis">
      <td><span class="cand-id">${c.id}</span></td>
      <td>${tierBadge(score, a.tier_label)}</td>
      <td>${scoreHtml}</td>
      <td style="color:var(--muted);font-size:.82rem">${shift}</td>
      <td style="color:var(--muted);font-size:.82rem">${submitted}</td>
      <td style="color:var(--muted);font-size:.8rem">${ts}</td>
      <td><button class="btn btn-ghost" style="padding:5px 12px;font-size:.75rem" onclick="event.stopPropagation();openDetail('${c.id}')">👁 View</button></td>
    </tr>`;
      }).join('');

      $('tableWrap').innerHTML = `<table>
    <thead><tr>
      <th>Candidate ID</th><th>Authenticity Tier</th><th>Score</th>

      <th>Style Shift</th><th>Reviewed By</th><th>Date</th><th></th>
    </tr></thead>
    <tbody>${tbody}</tbody>
  </table>`;
    }

    // ── Detail modal ──────────────────────────────────────────────────────────────
    function ringClass(s) {
      if (s === '—' || s == null) return 'amber';
      return s >= 75 ? 'green' : s >= 60 ? 'amber' : s >= 40 ? 'orange' : 'red';
    }

    function openDetail(id) {
      const c = allCandidates.find(x => x.id === id);
      if (!c) return;
      const a = c.analysis || {};
      const hasAnalysis = Object.keys(a).length > 0;
      $('modalTitle').textContent = `📋 ${id}`;

      const score     = a.authenticity_score != null ? Math.round(a.authenticity_score) : '—';
      const shift     = a.style_shift || '—';
      const tier      = a.tier_label || deriveTier(score);
      const conf      = a.confidence?.label || a.confidence_level || '—';
      const confScore = a.confidence?.score != null ? Math.round(a.confidence.score * 100) + '%' : '';
      const summary   = a.summary || '';
      const personal  = c.personal  || '(not recorded)';
      const technical = c.technical || '(not recorded)';
      const safe      = a.safe_interpretation || a.short_guardrail || '';
      const disclaimer = a.disclaimer || '';

      // Evidence cards
      const evidence = (a.evidence || []);
      const evidenceHtml = evidence.length ? evidence.map(e => {
        const sevClass = e.severity === 'high' ? 'sev-high' : e.severity === 'low' ? 'sev-low' : 'sev-medium';
        const sevIcon  = e.severity === 'high' ? '🔺' : e.severity === 'low' ? '✓' : '⚡';
        return `<div class="evidence-card">
          <div class="evidence-sev ${sevClass}">${sevIcon}</div>
          <div class="evidence-body">
            <div class="evidence-label">${escHtml(e.label)}</div>
            <div class="evidence-desc">${escHtml(e.description || '')}</div>
            <div class="evidence-val">${escHtml(e.value || '')}${e.action ? ' · ' + escHtml(e.action) : ''}</div>
          </div>
        </div>`;
      }).join('') : '<span style="color:var(--muted);font-size:.8rem">No evidence items recorded.</span>';

      // Follow-up questions
      const followups = (a.followup_questions || []);
      const followupHtml = followups.length ? followups.map((q,i) =>
        `<div class="followup-card">💬 <b>Q${i+1}:</b> ${escHtml(q)}</div>`
      ).join('') : '';

      // Flags
      const flagsHtml = (a.flags || []).length
        ? (a.flags).map(f => `<span class="flag-chip">${escHtml(f)}</span>`).join('')
        : '<span style="color:var(--muted);font-size:.8rem">No behavioral flags detected.</span>';

      // Style breakdown metrics
      const sb = a.shift_breakdown || {};
      const pp = a.personal_profile || {};
      const tp = a.technical_profile || {};
      const metricsHtml = (Object.keys(sb).length || Object.keys(pp).length || Object.keys(tp).length) ? `
        <div class="metric-row" style="flex-wrap: wrap; gap: 10px;">
          ${ [['Vocab Level', pp.vocabulary_level, tp.vocabulary_level],
               ['Formality', pp.formality_score, tp.formality_score],
               ['FK Grade', pp.flesch_kincaid, tp.flesch_kincaid],
               ['Gunning Fog', pp.gunning_fog, tp.gunning_fog],
               ['Sentence Len', pp.avg_sentence_len, tp.avg_sentence_len],
               ['Burstiness', pp.sentence_burstiness, tp.sentence_burstiness],
               ['Grammar', pp.grammar_score, tp.grammar_score],
               ['Fillers', pp.filler_ratio != null ? pp.filler_ratio * 100 : null, tp.filler_ratio != null ? tp.filler_ratio * 100 : null],
               ['Passive Voice', pp.passive_voice_ratio != null ? pp.passive_voice_ratio * 100 : null, tp.passive_voice_ratio != null ? tp.passive_voice_ratio * 100 : null],
               ['Transitions', pp.transition_density != null ? pp.transition_density * 100 : null, tp.transition_density != null ? tp.transition_density * 100 : null],
               ['Hedging', pp.hedging_density != null ? pp.hedging_density * 100 : null, tp.hedging_density != null ? tp.hedging_density * 100 : null],
               ['AI Boilerplate', pp.ai_boilerplate, tp.ai_boilerplate],
               ['Pronouns', pp.personal_pronoun_ratio != null ? pp.personal_pronoun_ratio * 100 : null, tp.personal_pronoun_ratio != null ? tp.personal_pronoun_ratio * 100 : null],
               ['AI Starters', pp.ai_sentence_starters != null ? pp.ai_sentence_starters * 100 : null, tp.ai_sentence_starters != null ? tp.ai_sentence_starters * 100 : null]]
             .map(([lbl, pv, tv]) => {
               const delta = (tv != null && pv != null) ? (tv - pv).toFixed(1) : '—';
               const col   = delta !== '—' && Math.abs(delta) > 15 ? '#f43f5e' : delta !== '—' && Math.abs(delta) > 7 ? '#f59e0b' : '#10b981';
               return `<div class="metric-tile" style="flex: 1 1 calc(33.333% - 10px); min-width: 110px;">
                 <div class="metric-val" style="color:${col}">${delta !== '—' ? (delta > 0 ? '+' : '') + delta : '—'}</div>
                 <div class="metric-lbl">${lbl}</div>
               </div>`;
             }).join('')}
        </div>
        <div style="font-size:.7rem;color:var(--muted);margin-top:6px">↑ values = technical vs personal delta (red = large jump)</div>` : '';

      // Temporal drift window bars
      const driftWin = (a.temporal_drift?.window_scores || []);
      const driftHtml = driftWin.length ? `
        <div class="drift-window-bar">
          ${driftWin.map((ws, i) => {
            const h = Math.max(8, Math.round(ws / 100 * 40));
            const col = ws >= 70 ? '#10b981' : ws >= 40 ? '#f59e0b' : '#f43f5e';
            return `<div class="drift-bar-col">
              <div class="drift-bar-fill" style="height:${h}px;background:${col};opacity:.8"></div>
              <div class="drift-bar-lbl">W${i+1}<br>${ws.toFixed(0)}</div>
            </div>`;
          }).join('')}
        </div>
        <div style="font-size:.7rem;color:var(--muted);margin-top:4px">
          Drift score: <b style="color:${(a.temporal_drift?.drift_score||0)>20?'#f43f5e':'#10b981'}">${(a.temporal_drift?.drift_score||0).toFixed(1)} pts</b>
          &nbsp;·&nbsp; ${a.temporal_drift?.has_spike ? '⚠️ Spike detected mid-session' : '✅ Stable throughout'}
        </div>` : '<span style="color:var(--muted);font-size:.8rem">No temporal drift data.</span>';

      // ── Shift Score: use shift_score → lsdi_score → computed fallback ──────
      const shiftScoreVal = a.shift_score != null ? a.shift_score
        : a.lsdi_score != null ? a.lsdi_score
        : null;

      // ── Inline Plag Risk: use stored value or derive from cosine + vocab ────
      let inlinePlagVal = a.inline_plagiarism_risk != null ? a.inline_plagiarism_risk : null;
      if (inlinePlagVal == null) {
        // Derive from cosine similarity + vocab jump signals
        const cosine = a.cosine_similarity || 0;
        const pp2 = a.personal_profile || {};
        const tp2 = a.technical_profile || {};
        const vocJump = (tp2.vocabulary_level || 0) - (pp2.vocabulary_level || 0);
        const fillDrop = (pp2.filler_ratio || 0) - (tp2.filler_ratio || 0);
        let derived = 0;
        if (cosine > 0.65) derived += 35;
        else if (cosine > 0.45) derived += 15;
        if (vocJump > 18) derived += 25;
        else if (vocJump > 10) derived += 12;
        if (fillDrop > 0.03 && (pp2.filler_ratio || 0) > 0.01) derived += 20;
        inlinePlagVal = Math.min(100, Math.round(derived));
      }
      const inlinePlag = inlinePlagVal + '%';

      // ── Plagiarism Check: external API data OR risk-level from style shift ──
      let plag;
      if (a.plagiarism_data?.technical?.plagiarism?.score != null) {
        plag = a.plagiarism_data.technical.plagiarism.score.toFixed(1) + '%';
      } else {
        // Derive from inline plag risk + style shift level
        const shiftLvl = String(a.style_shift || 'LOW').toUpperCase();
        const base = inlinePlagVal || 0;
        const derived = shiftLvl === 'VERY HIGH' ? Math.max(base, 65)
          : shiftLvl === 'HIGH' ? Math.max(base, 45)
          : shiftLvl === 'MODERATE' ? Math.max(base, 25) : base;
        plag = `~${Math.min(100, derived)}% <span style="font-size:.65rem;opacity:.6">(est)</span>`;
      }

      // ── AI Detection: external API or derive from lsdi + boilerplate ────────
      let aiDet;
      if (a.plagiarism_data?.technical?.ai_detection?.score != null) {
        aiDet = a.plagiarism_data.technical.ai_detection.score.toFixed(1) + '%';
      } else {
        const tp3 = a.technical_profile || {};
        const boilerplate = (tp3.ai_boilerplate || 0) * 100;
        const lsdi = shiftScoreVal || 0;
        const aiEst = Math.min(100, Math.round((lsdi * 0.6) + (boilerplate * 0.4)));
        aiDet = `~${aiEst}% <span style="font-size:.65rem;opacity:.6">(est)</span>`;
      }

      if (!hasAnalysis) {
        $('modalBody').innerHTML = `
          <div style="text-align:center;padding:40px 0;color:var(--muted)">
            <div style="font-size:2rem;margin-bottom:12px">⏳</div>
            <div style="font-weight:600;margin-bottom:6px">Analysis Pending</div>
            <div style="font-size:.82rem">This candidate has transcripts recorded but post-session analysis has not been run yet.</div>
            <div class="transcript-block" style="margin-top:20px;text-align:left">
              <b>Personal:</b> ${escHtml(personal)}
            </div>
            <div class="transcript-block" style="margin-top:10px;text-align:left">
              <b>Technical:</b> ${escHtml(technical)}
            </div>
          </div>`;
        $('modalOverlay').classList.add('open');
        return;
      }

      // Round all decimal scores to integers
      const shiftScoreRounded = shiftScoreVal != null ? Math.round(shiftScoreVal) : null;
      const inlinePlagRounded = Math.round(inlinePlagVal || 0);

      $('modalBody').innerHTML = `

        <!-- Score ring + verdict -->
        <div class="score-ring-wrap">
          <div class="score-ring ${ringClass(score)}">${score !== '—' ? score : '?'}</div>
          <div class="score-meta">
            <div class="score-tier">${tier}</div>
            <div class="score-verdict">${verdictBadge(a.verdict)}</div>
            <span class="conf-pill">🎯 Confidence: ${conf}${confScore ? ' · ' + confScore : ''}</span>
          </div>
        </div>

        <!-- Key metrics row -->
        <div class="detail-grid">
          <div class="detail-tile"><div class="detail-label">Style Shift</div><div class="detail-val" style="font-size:1rem">${shift}</div></div>
          <div class="detail-tile"><div class="detail-label">Shift Score</div><div class="detail-val" style="font-size:1rem">${shiftScoreRounded != null ? shiftScoreRounded : '—'}</div></div>
          <div class="detail-tile"><div class="detail-label">Inline Plag Risk</div><div class="detail-val" style="font-size:1rem">${inlinePlagRounded}%</div></div>
          <div class="detail-tile"><div class="detail-label">Plagiarism Check</div><div class="detail-val" style="font-size:1rem">${plag}</div></div>
          <div class="detail-tile"><div class="detail-label">AI Detection</div><div class="detail-val" style="font-size:1rem">${aiDet}</div></div>
          <div class="detail-tile"><div class="detail-label">LSDI Score</div><div class="detail-val" style="font-size:1rem;color:${shiftScoreRounded>60?'#f43f5e':shiftScoreRounded>35?'#f59e0b':'#10b981'}">${shiftScoreRounded != null ? shiftScoreRounded+'/100' : '—'}</div></div>
          <div class="detail-tile"><div class="detail-label">Reviewed By</div><div class="detail-val" style="font-size:.85rem">${c.submitted_by || '—'}</div></div>
        </div>

        <!-- Summary -->
        ${summary ? `<div>
          <div class="section-label">📝 Summary</div>
          <div style="font-size:.84rem;color:var(--muted);line-height:1.65">${escHtml(summary)}</div>
        </div>` : ''}

        <!-- Evidence -->
        <div>
          <div class="section-label">🔍 Evidence</div>
          <div style="display:flex;flex-direction:column;gap:8px">${evidenceHtml}</div>
        </div>

        <!-- Flags -->
        <div>
          <div class="section-label">🚩 Behavioral Flags</div>
          <div class="flags-wrap">${flagsHtml}</div>
        </div>

        <!-- Temporal drift -->
        <div>
          <div class="section-label">📈 Temporal Drift (Window Scores)</div>
          ${driftHtml}
        </div>

        <!-- Style breakdown -->
        ${metricsHtml ? `<div>
          <div class="section-label">📊 Style Shift Breakdown</div>
          ${metricsHtml}
        </div>` : ''}

        <!-- Follow-up questions -->
        ${followupHtml ? `<div>
          <div class="section-label">💡 Suggested Follow-up Questions</div>
          <div style="display:flex;flex-direction:column;gap:6px">${followupHtml}</div>
        </div>` : ''}

        <!-- Transcripts -->
        <div>
          <div class="section-label">🎙️ Personal Response</div>
          <div class="transcript-block">${escHtml(personal)}</div>
        </div>
        <div>
          <div class="section-label">💻 Technical Response</div>
          <div class="transcript-block">${escHtml(technical)}</div>
        </div>

        <!-- Disclaimer -->
        ${safe || disclaimer ? `<div class="safe-note">
          ${safe ? '⚠️ ' + escHtml(safe) + '<br>' : ''}
          ${disclaimer ? escHtml(disclaimer) : ''}
        </div>` : ''}

        <!-- PDF Download action -->
        <div class="modal-pdf-actions" style="display:flex;gap:10px;padding-top:4px;border-top:1px solid var(--border);margin-top:4px">
          <button class="btn-pdf-modal" onclick="downloadCandidatePDF('${c.id}')" id="modalPdfBtn">📄 Download PDF Report</button>
        </div>
      `;
      // Store current candidate for PDF use
      window._pdfCandidate = c;

      $('modalOverlay').classList.add('open');
    }

    function escHtml(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function scoreColor(v) {
      if (v === '—' || v == null) return '';
      return v >= 70 ? 'score-green' : v >= 40 ? 'score-amber' : 'score-red';
    }

    // ── PDF Export matching dashboard detail view ─────────────────────────────
    async function downloadCandidatePDF(candidateId) {
      const btn = document.getElementById('modalPdfBtn');
      if (btn) { btn.textContent = 'Generating…'; btn.disabled = true; }
      try {
        const c = window._pdfCandidate;
        if (!c) throw new Error('No candidate data');
        const a = c.analysis || {};
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: 'mm', format: 'a4' });
        const W = 210, M = 16, CW = W - M * 2;
        let y = 0;

        // ── Dark background ──────────────────────────────────────────────────
        doc.setFillColor(4, 6, 15);
        doc.rect(0, 0, W, 297, 'F');

        // ── Gradient header ──────────────────────────────────────────────────
        const steps = 40;
        for (let i = 0; i < steps; i++) {
          const t = i / steps;
          doc.setFillColor(
            Math.round(99  + t * (6   - 99)),
            Math.round(102 + t * (182 - 102)),
            Math.round(241 + t * (212 - 241))
          );
          doc.rect(i * (W / steps), 0, W / steps + 1, 44, 'F');
        }
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(22); doc.setFont('helvetica', 'bold');
        doc.text('SachhAI', M, 16);
        doc.setFontSize(10); doc.setFont('helvetica', 'normal');
        doc.setTextColor(220, 235, 255);
        doc.text('Interview Authenticity Report', M, 25);
        doc.setFontSize(8); doc.setTextColor(200, 215, 245);
        const dateStr = new Date().toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
        doc.text(`Candidate: ${c.id}   |   ${dateStr}   |   Submitted by: ${c.submitted_by || '—'}`, M, 37);
        y = 54;

        // ── Helper: page check ───────────────────────────────────────────────
        const checkPage = (needed = 20) => {
          if (y + needed > 282) { doc.addPage(); doc.setFillColor(4,6,15); doc.rect(0,0,W,297,'F'); y = 18; }
        };

        // ── Score ring section (replicate as tile row) ───────────────────────
        const score = a.authenticity_score != null ? Math.round(a.authenticity_score) : null;
        const shiftScore = a.shift_score != null ? Math.round(a.shift_score) : a.lsdi_score != null ? Math.round(a.lsdi_score) : null;
        const tier = a.tier_label || deriveTier(score);
        const verdict = a.verdict || '—';
        const conf = a.confidence?.label || a.confidence_level || '—';
        const shift = a.style_shift || '—';
        const summary = a.summary || '';
        const personal = c.personal || '(not recorded)';
        const technical = c.technical || '(not recorded)';

        // Score colour helper
        const sc = (v) => v >= 75 ? [16,185,129] : v >= 60 ? [245,158,11] : v >= 40 ? [249,115,22] : [244,63,94];
        const scoreCol = sc(score);

        // Score ring tile
        const ringX = M, ringW = 48;
        doc.setFillColor(13, 17, 23);
        doc.roundedRect(ringX, y, ringW, 36, 4, 4, 'F');
        doc.setDrawColor(...scoreCol); doc.setLineWidth(1.2);
        doc.circle(ringX + ringW/2, y + 18, 12, 'S');
        doc.setTextColor(...scoreCol); doc.setFontSize(13); doc.setFont('helvetica', 'bold');
        const scoreStr = score != null ? String(score) : '?';
        doc.text(scoreStr, ringX + ringW/2, y + 20.5, { align: 'center' });

        // Verdict / tier block next to ring
        const metaX = M + ringW + 6;
        doc.setTextColor(226, 232, 240); doc.setFontSize(11); doc.setFont('helvetica', 'bold');
        doc.text(tier, metaX, y + 10);
        const vCol = verdict.toUpperCase() === 'GENUINE' ? [16,185,129] : verdict.toUpperCase().includes('SUSPICIOUS') ? [244,63,94] : [245,158,11];
        doc.setTextColor(...vCol); doc.setFontSize(8.5); doc.setFont('helvetica', 'bold');
        doc.text(verdict.toUpperCase(), metaX, y + 18);
        doc.setFillColor(99,102,241,0.15); doc.setTextColor(165,180,252); doc.setFontSize(7.5); doc.setFont('helvetica', 'normal');
        doc.text(`Confidence: ${conf}`, metaX, y + 26);
        y += 44;

        // ── Key metrics grid (2-up tiles) ─────────────────────────────────────
        checkPage(32);
        const inlinePlagV = a.inline_plagiarism_risk != null ? Math.round(a.inline_plagiarism_risk) : 0;
        const tiles = [
          { lbl: 'STYLE SHIFT',    val: shift,                                     col: [148,163,184] },
          { lbl: 'SHIFT SCORE',    val: shiftScore != null ? `${shiftScore}/100` : '—', col: shiftScore>60?[244,63,94]:shiftScore>35?[245,158,11]:[16,185,129] },
          { lbl: 'INLINE PLAG',    val: `${inlinePlagV}%`,                          col: inlinePlagV>=60?[244,63,94]:inlinePlagV>=35?[245,158,11]:[16,185,129] },
          { lbl: 'LSDI SCORE',     val: shiftScore != null ? `${shiftScore}/100` : '—', col: [167,139,250] },
        ];
        const tw2 = CW / tiles.length;
        tiles.forEach((tile, i) => {
          const tx = M + i * tw2;
          doc.setFillColor(18, 22, 36); doc.roundedRect(tx, y, tw2-3, 24, 3, 3, 'F');
          doc.setFillColor(...tile.col); doc.roundedRect(tx, y, tw2-3, 2.5, 1, 1, 'F');
          doc.setTextColor(130,140,165); doc.setFontSize(6); doc.setFont('helvetica','bold');
          doc.text(tile.lbl, tx+4, y+9);
          doc.setTextColor(...tile.col); doc.setFontSize(11); doc.setFont('helvetica','bold');
          doc.text(String(tile.val), tx+4, y+19);
        });
        y += 32;

        // ── Summary ───────────────────────────────────────────────────────────
        if (summary) {
          checkPage(20);
          doc.setFontSize(8.5); doc.setFont('helvetica','bold'); doc.setTextColor(34,211,238);
          doc.text('SUMMARY', M, y); y += 5;
          doc.setFont('helvetica','normal'); doc.setTextColor(200,210,225); doc.setFontSize(8.5);
          const sumLines = doc.splitTextToSize(summary, CW);
          checkPage(sumLines.length * 5 + 6);
          doc.text(sumLines, M, y); y += sumLines.length * 5 + 8;
        }

        // ── Evidence ──────────────────────────────────────────────────────────
        const evidence = a.evidence || [];
        if (evidence.length) {
          checkPage(16);
          doc.setFontSize(8.5); doc.setFont('helvetica','bold'); doc.setTextColor(34,211,238);
          doc.text('EVIDENCE', M, y); y += 6;
          evidence.forEach(e => {
            const sevCol = e.severity==='high' ? [244,63,94] : e.severity==='low' ? [16,185,129] : [245,158,11];
            const sevTxt = e.severity==='high' ? '[HIGH]' : e.severity==='low' ? '[LOW]' : '[MED]';
            const lineText = `${sevTxt} ${e.label || ''}: ${e.description || ''} ${e.value ? '(' + e.value + ')' : ''}`;
            const lines = doc.splitTextToSize(lineText.trim(), CW - 6);
            checkPage(lines.length * 5 + 8);
            doc.setFillColor(20,24,38); doc.roundedRect(M, y, CW, lines.length * 5 + 6, 2.5, 2.5, 'F');
            doc.setDrawColor(...sevCol,0.3); doc.setLineWidth(0.4);
            doc.roundedRect(M, y, CW, lines.length * 5 + 6, 2.5, 2.5, 'S');
            doc.setFillColor(...sevCol); doc.roundedRect(M, y, 3.5, lines.length * 5 + 6, 1.5, 1.5, 'F');
            doc.setTextColor(...sevCol); doc.setFont('helvetica','bold'); doc.setFontSize(7.5);
            doc.text(sevTxt, M+6, y+4);
            doc.setTextColor(200,210,225); doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
            doc.text(doc.splitTextToSize(`${e.label || ''}: ${e.description || ''}`, CW - 14), M+6, y+4+5);
            y += lines.length * 5 + 10;
          });
          y += 4;
        }

        // ── Flags ─────────────────────────────────────────────────────────────
        const flags = a.flags || [];
        if (flags.length) {
          checkPage(16);
          doc.setFontSize(8.5); doc.setFont('helvetica','bold'); doc.setTextColor(34,211,238);
          doc.text('BEHAVIORAL FLAGS', M, y); y += 6;
          flags.forEach(f => {
            const cleanF = f.replace(/[\u{1F000}-\u{1FFFF}]/gu,'').replace(/⚠️/g,'[!]').replace(/✓/g,'[OK]').trim();
            const fl = doc.splitTextToSize('[!] ' + cleanF, CW - 6);
            checkPage(fl.length * 5 + 8);
            doc.setFillColor(40,18,18); doc.roundedRect(M, y, CW, fl.length * 5 + 5, 2, 2, 'F');
            doc.setFont('helvetica','normal'); doc.setTextColor(248,113,113); doc.setFontSize(7.5);
            doc.text(fl, M+4, y+5);
            y += fl.length * 5 + 8;
          });
          y += 4;
        }

        // ── Temporal Drift ────────────────────────────────────────────────────
        const temporal = a.temporal_drift;
        if (temporal && temporal.window_scores && temporal.window_scores.length) {
          checkPage(36);
          doc.setFontSize(8.5); doc.setFont('helvetica','bold'); doc.setTextColor(34,211,238);
          doc.text('TEMPORAL DRIFT (WINDOW SCORES)', M, y); y += 6;
          const ws = temporal.window_scores;
          const twW = CW / ws.length;
          ws.forEach((wscore, i) => {
            const tx = M + i * twW;
            const fillC = wscore >= 70 ? [16,185,129] : wscore >= 40 ? [245,158,11] : [244,63,94];
            doc.setFillColor(20,24,38); doc.roundedRect(tx, y, twW-3, 22, 3, 3, 'F');
            doc.setFillColor(...fillC); doc.roundedRect(tx, y, twW-3, 3, 1, 1, 'F');
            doc.setTextColor(130,140,165); doc.setFontSize(7); doc.setFont('helvetica','bold');
            doc.text(`W${i+1}`, tx+4, y+10);
            doc.setTextColor(...fillC); doc.setFontSize(13); doc.setFont('helvetica','bold');
            doc.text(String(Math.round(wscore)), tx+4, y+19);
          });
          y += 28;
          const driftScore = Math.round(temporal.drift_score || 0);
          doc.setFont('helvetica','normal'); doc.setTextColor(150,160,180); doc.setFontSize(7.5);
          const dNote = temporal.has_spike
            ? `Spike detected at window ${temporal.drift_window} (+${driftScore} pts) — external assistance pattern.`
            : `Stable across all windows. Drift score: ${driftScore} pts.`;
          const dLines = doc.splitTextToSize(dNote, CW);
          doc.text(dLines, M, y); y += dLines.length * 4.5 + 8;
        }

        // ── Style Breakdown ───────────────────────────────────────────────────
        const pp = a.personal_profile || {};
        const tp = a.technical_profile || {};
        const metricsList = [
          ['Vocab Level', pp.vocabulary_level, tp.vocabulary_level],
          ['Formality', pp.formality_score, tp.formality_score],
          ['FK Grade', pp.flesch_kincaid, tp.flesch_kincaid],
          ['Gunning Fog', pp.gunning_fog, tp.gunning_fog],
          ['Sent Len', pp.avg_sentence_len, tp.avg_sentence_len],
          ['Grammar', pp.grammar_score, tp.grammar_score],
        ].filter(([,pv,tv]) => pv != null && tv != null);
        if (metricsList.length) {
          checkPage(24);
          doc.setFontSize(8.5); doc.setFont('helvetica','bold'); doc.setTextColor(34,211,238);
          doc.text('STYLE SHIFT BREAKDOWN (personal → technical delta)', M, y); y += 6;
          const mTw = CW / 3;
          metricsList.forEach(([lbl, pv, tv], i) => {
            if (i % 3 === 0) { checkPage(20); }
            const tx = M + (i % 3) * mTw;
            const tileY = y + Math.floor(i / 3) * 22;
            const delta = Math.round(tv - pv);
            const col = Math.abs(delta) > 15 ? [244,63,94] : Math.abs(delta) > 7 ? [245,158,11] : [16,185,129];
            doc.setFillColor(18,22,36); doc.roundedRect(tx, tileY, mTw-4, 18, 3, 3, 'F');
            doc.setTextColor(...col); doc.setFontSize(10); doc.setFont('helvetica','bold');
            doc.text((delta >= 0 ? '+' : '') + delta, tx+4, tileY+11);
            doc.setTextColor(148,163,184); doc.setFontSize(6); doc.setFont('helvetica','bold');
            doc.text(lbl.toUpperCase(), tx+4, tileY+16);
          });
          const rows = Math.ceil(metricsList.length / 3);
          y += rows * 22 + 6;
        }

        // ── Follow-up Questions ────────────────────────────────────────────────
        const followups = a.followup_questions || [];
        if (followups.length) {
          checkPage(20);
          doc.setFontSize(8.5); doc.setFont('helvetica','bold'); doc.setTextColor(34,211,238);
          doc.text('SUGGESTED FOLLOW-UP QUESTIONS', M, y); y += 6;
          followups.forEach((q, i) => {
            const ql = doc.splitTextToSize(`Q${i+1}: ${q}`, CW-6);
            checkPage(ql.length * 5 + 6);
            doc.setFillColor(6,182,212,0.07); doc.roundedRect(M, y, CW, ql.length*5+5, 2.5, 2.5, 'F');
            doc.setTextColor(103,232,249); doc.setFont('helvetica','normal'); doc.setFontSize(8);
            doc.text(ql, M+4, y+5);
            y += ql.length * 5 + 8;
          });
          y += 4;
        }

        // ── Transcripts ───────────────────────────────────────────────────────
        checkPage(20);
        doc.setFontSize(8.5); doc.setFont('helvetica','bold'); doc.setTextColor(34,211,238);
        doc.text('PERSONAL RESPONSE TRANSCRIPT', M, y); y += 5;
        doc.setFillColor(0,0,0,0.3); doc.roundedRect(M, y, CW, 3, 1, 1, 'F');
        const pLines = doc.splitTextToSize(personal.slice(0,800), CW-4);
        checkPage(pLines.length * 4.5 + 10);
        doc.setFillColor(10,14,22); doc.roundedRect(M, y, CW, pLines.length*4.5+6, 2.5, 2.5, 'F');
        doc.setTextColor(148,163,184); doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
        doc.text(pLines, M+4, y+5);
        y += pLines.length * 4.5 + 12;

        checkPage(20);
        doc.setFontSize(8.5); doc.setFont('helvetica','bold'); doc.setTextColor(34,211,238);
        doc.text('TECHNICAL RESPONSE TRANSCRIPT', M, y); y += 5;
        const tLines = doc.splitTextToSize(technical.slice(0,800), CW-4);
        checkPage(tLines.length * 4.5 + 10);
        doc.setFillColor(10,14,22); doc.roundedRect(M, y, CW, tLines.length*4.5+6, 2.5, 2.5, 'F');
        doc.setTextColor(148,163,184); doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
        doc.text(tLines, M+4, y+5);
        y += tLines.length * 4.5 + 12;

        // ── Footer ────────────────────────────────────────────────────────────
        const totalPages = doc.getNumberOfPages();
        for (let pg = 1; pg <= totalPages; pg++) {
          doc.setPage(pg);
          doc.setFontSize(7); doc.setTextColor(80,90,110);
          doc.text('Generated by SachhAI — Interview Integrity Platform', M, 290);
          doc.text(`Page ${pg} / ${totalPages}`, W - M, 290, { align:'right' });
        }

        doc.save(`SachhAI_${c.id}_${Date.now()}.pdf`);
      } catch(err) {
        alert('PDF export failed: ' + err.message);
        console.error('[PDF]', err);
      } finally {
        if (btn) { btn.textContent = '📄 Download PDF Report'; btn.disabled = false; }
      }
    }

    loadCandidates();
  </script>
</body>

</html>
